# Cloudflare Pages configuration.
#
# Create the KV namespace once, then paste its id below:
#   npx wrangler kv namespace create ASFC_KV
#
# The two secrets are set separately (they are never stored in this file):
#   npx wrangler pages secret put ADMIN_PASSWORD
#   npx wrangler pages secret put AUTH_SECRET
name = "asfc"
compatibility_date = "2025-06-01"
pages_build_output_dir = "dist"

[[kv_namespaces]]
binding = "ASFC_KV"
id = "PASTE_YOUR_KV_NAMESPACE_ID_HERE"
